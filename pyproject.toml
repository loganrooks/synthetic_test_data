[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synth_data_gen"
version = "0.1.0"
description = "A library for generating synthetic test data in EPUB, PDF, and Markdown formats for testing document processing pipelines."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Synthetic Data Gen Contributors"},
]
keywords = ["synthetic-data", "testing", "epub", "pdf", "markdown", "document-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Markup",
]
requires-python = ">=3.8"
dependencies = [
    "ebooklib>=0.18",
    "reportlab>=4.0",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
synth-data = "synth_data_gen:generate_data"
synth-analyze = "synth_data_gen.analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/synth-data-gen/synth_data_gen"
Repository = "https://github.com/synth-data-gen/synth_data_gen"
Documentation = "https://github.com/synth-data-gen/synth_data_gen#readme"
Issues = "https://github.com/synth-data-gen/synth_data_gen/issues"
Changelog = "https://github.com/synth-data-gen/synth_data_gen/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["synth_data_gen*"]

[tool.setuptools.package-data]
"synth_data_gen.core" = ["*.yaml"]
"synth_data_gen.analyzer.patterns" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["synth_data_gen"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py38"
line-length = 120
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict= (Python 3.10+)
    "ARG001", # unused function argument (common in base classes)
    "ARG002", # unused method argument
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["synth_data_gen"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Start permissive, tighten later
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ebooklib.*",
    "reportlab.*",
]
ignore_missing_imports = true
